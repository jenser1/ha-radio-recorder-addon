name: "Radio Recorder"
version: "0.3.1"
slug: "radio_recorder"
description: "Internetradio zeitgesteuert mit FFmpeg aufzeichnen"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:radio
panel_title: "Radio Recorder"
map:
  - type: media
    read_only: false
options:
  output_dir: "/media/Musick/Radioaufnahmen"
  default_duration_hours: 4
  default_duration_minutes: 0
  segment_minutes: 10
  min_free_mb: 500
schema:
  output_dir: str
  default_duration_hours: int(0,24)
  default_duration_minutes: int(0,59)
  segment_minutes: int(1,60)
  min_free_mb: int(0,1048576)
  work_dir: str?
