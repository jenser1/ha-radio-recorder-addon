name: "Radio Recorder"
version: "0.7.2"
slug: "radio_recorder"
description: "Internetradio zeitgesteuert mit FFmpeg aufzeichnen"
url: "https://github.com/jenser1/ha-radio-recorder-addon"
arch:
  - amd64
  - aarch64
# startup, boot und ingress_port stehen bewusst nicht hier: application,
# auto und 8099 sind bereits die Vorgaben des Supervisors.
init: false
ingress: true
panel_icon: mdi:radio
panel_title: "Radio Recorder"
map:
  - type: media
    read_only: false
options:
  output_dir: "/media/radio"
  default_duration_hours: 4
  default_duration_minutes: 0
  segment_minutes: 10
  min_free_mb: 500
schema:
  output_dir: str
  default_duration_hours: int(0,24)
  default_duration_minutes: int(0,59)
  segment_minutes: int(1,60)
  min_free_mb: int(0,1048576)
  work_dir: str?
